# Development environment for the whole stack.
# Run `docker compose up` and everything (app + database) starts together.
# No Ruby/Postgres install needed on your machine — only Docker.
#
# Redis and MongoDB services get ADDED to this same file later:
#   - Redis  in Milestone 3 (rate limiting) / Milestone 5 (log buffer)
#   - Mongo  in Milestone 5 (audit-log sink)
# Commit 0.1 needs only the app and Postgres.

name: inventory-management

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"          # expose to host so you can inspect with a GUI if wanted
    volumes:
      - pg_data:/var/lib/postgresql/data   # persist data across restarts
    healthcheck:
      # web waits until Postgres actually accepts connections, not just "started"
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"            # buffer for the audit-log pipeline (ADR-0007) + jobs

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"          # durable audit-log sink (ADR-0007)
    volumes:
      - mongo_data:/data/db

  web:
    build: ./backend           # builds backend/Dockerfile
    command: bin/rails server -b 0.0.0.0
    environment:
      DATABASE_HOST: db        # "db" = the service name above; Docker's DNS resolves it
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://mongo:27017/inventory_audit_development
      # Platform admin (RailsAdmin) credentials. Defaults for local dev; override
      # by putting ADMIN_USER / ADMIN_PASSWORD in a repo-root .env file.
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
    ports:
      - "3000:3000"            # http://localhost:3000
    volumes:
      - ./backend:/app         # live-mount source -> code edits reload without rebuild
      # NOTE: no named volume over /usr/local/bundle — the gems installed during
      # `docker compose build` live in the image and are used directly. (A bundle
      # volume would shadow them with an empty dir on first run.) Trade-off:
      # changing the Gemfile means `docker compose build web` again.
    depends_on:
      db:
        condition: service_healthy   # don't start web until db passes its healthcheck
      redis:
        condition: service_started
      mongo:
        condition: service_started

  # React SPA dev server (commit 6.1). The anonymous /app/node_modules volume keeps
  # the image's installed deps from being shadowed by the source bind-mount.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:3000

volumes:
  pg_data:
  mongo_data:
