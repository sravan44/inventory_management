---
openapi: 3.0.1
info:
  title: Inventory Management API
  version: v1
  description: Multi-tenant inventory management SaaS. Global auth endpoints are served
    on the apex host; tenant-scoped endpoints use a tenant subdomain.
paths:
  "/api/v1/auth/register":
    post:
      summary: Register a new user (auto-login)
      tags:
      - Auth
      parameters: []
      responses:
        '201':
          description: user created; returns token pair + user + memberships
        '422':
          description: validation failed
        '400':
          description: user param missing
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: sam@acme.io
                    password:
                      type: string
                      example: hunter2pw
                    first_name:
                      type: string
                      example: Sam
                    last_name:
                      type: string
                      example: Rivera
                  required:
                  - email
                  - password
              required:
              - user
  "/api/v1/auth/login":
    post:
      summary: Log in
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: token pair + user + memberships
        '401':
          description: invalid credentials
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: sam@acme.io
                password:
                  type: string
                  example: hunter2pw
              required:
              - email
              - password
  "/api/v1/auth/refresh":
    post:
      summary: Rotate tokens with a refresh token
      tags:
      - Auth
      parameters: []
      responses:
        '200':
          description: new token pair
        '401':
          description: invalid or expired refresh token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/auth/logout":
    post:
      summary: Log out (revoke one refresh token)
      tags:
      - Auth
      parameters: []
      responses:
        '204':
          description: revoked (idempotent)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
              required:
              - refresh_token
  "/api/v1/auth/logout_all":
    post:
      summary: Log out everywhere (revoke all refresh tokens)
      tags:
      - Auth
      security:
      - bearer_auth: []
      responses:
        '204':
          description: all sessions revoked
        '401':
          description: missing/invalid token
  "/api/v1/me":
    get:
      summary: Current user + memberships
      tags:
      - Identity
      security:
      - bearer_auth: []
      responses:
        '200':
          description: the current user and their memberships
        '401':
          description: missing/invalid token
  "/api/v1/products":
    post:
      summary: Create a product
      tags:
      - Products
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: created (admin/staff, or an API key with that role)
        '409':
          description: duplicate SKU (sku_taken)
        '422':
          description: validation failed
        '403':
          description: a role that can't manage inventory (purchasing)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: object
                  properties:
                    sku:
                      type: string
                      example: ABC-1
                    name:
                      type: string
                      example: Widget
                    description:
                      type: string
                    unit_of_measure:
                      type: string
                      example: each
                  required:
                  - sku
                  - name
              required:
              - product
  "/api/v1/products/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show a product
      tags:
      - Products
      security:
      - bearer_auth: []
      responses:
        '200':
          description: found
        '404':
          description: soft-deleted or missing
    patch:
      summary: Update a product
      tags:
      - Products
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: updated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                    unit_of_measure:
                      type: string
              required:
              - product
    delete:
      summary: Soft-delete a product
      tags:
      - Products
      security:
      - bearer_auth: []
      responses:
        '204':
          description: deleted
  "/api/v1/stock_movements":
    post:
      summary: Record a stock movement
      tags:
      - Stock
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: recorded (ledger row + level updated)
        '409':
          description: insufficient stock
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stock_movement:
                  type: object
                  properties:
                    product_id:
                      type: string
                    warehouse_id:
                      type: string
                    movement_type:
                      type: string
                      enum:
                      - receipt
                      - adjustment
                      - transfer_in
                      - transfer_out
                      - sale
                    quantity_delta:
                      type: integer
                  required:
                  - product_id
                  - warehouse_id
                  - movement_type
                  - quantity_delta
              required:
              - stock_movement
  "/api/v1/tenants":
    post:
      summary: Create a tenant (async provisioning)
      tags:
      - Tenants
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '202':
          description: created; provisioning enqueued; creator is admin
        '401':
          description: not authenticated
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Acme
                    subdomain:
                      type: string
                      example: acme
                  required:
                  - name
                  - subdomain
              required:
              - tenant
  "/api/v1/warehouses":
    post:
      summary: Create a warehouse
      tags:
      - Warehouses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: created
        '409':
          description: duplicate code (code_taken)
        '403':
          description: a role that can't manage inventory (purchasing)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                warehouse:
                  type: object
                  properties:
                    name:
                      type: string
                      example: Main
                    code:
                      type: string
                      example: WH-1
                    address:
                      type: object
                      example:
                        city: Austin
                  required:
                  - name
                  - code
              required:
              - warehouse
  "/api/v1/warehouses/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      summary: Show a warehouse
      tags:
      - Warehouses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: found
        '404':
          description: soft-deleted or missing
    delete:
      summary: Soft-delete a warehouse
      tags:
      - Warehouses
      security:
      - bearer_auth: []
      responses:
        '204':
          description: deleted
servers:
- url: http://localhost:3000
  description: Local apex host (auth, /me)
- url: http://{subdomain}.lvh.me:3000
  description: Local tenant host (subdomain-scoped)
  variables:
    subdomain:
      default: acme
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
